<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SBMF Car Transport TMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a working tool for a small car carrier's office and its drivers: plain, quick, sure of itself
   IDEA: a car-carrier's job folder: one green cover (home), coloured tabs for each department
   PICTURE: the live numbers band on home and the truck position grid on each trip
   COLOUR and TYPE: white ground, emerald #00a86b for the cover band and actions, pale pink #ffd6e0 for things waiting on you, black text; Schibsted Grotesk
   LAYOUT: top bar with tabs and quick actions on every screen; each module a toolbar, then its list; trip and handover open as their own pages */
:root{color-scheme:light dark;
  --bg:light-dark(#ffffff,#04140d);--ink:light-dark(#0b0b0b,#e8f3ee);--muted:light-dark(#5b605d,#93a69d);
  --line:light-dark(#e3e6e4,#1d3329);--soft:light-dark(#f4f6f5,#0a2018);
  --em:#00a86b;--em-ink:#ffffff;--em-deep:light-dark(#007a4e,#3ed29a);
  --pink:light-dark(#ffd6e0,#4a1f2c);--pink-ink:light-dark(#5a1026,#ffd6e0);
  --bad:light-dark(#c4002f,#ff6b8a);--warn:light-dark(#9a5b00,#f2b350);
  --f:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.1;font-weight:800;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:22px}h3{font-size:17px}
a{color:var(--em-deep)}
.hint{color:var(--muted);font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nowrap{white-space:nowrap}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;gap:12px;padding:10px max(3vw,14px);flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;text-decoration:none;color:var(--ink);flex:none}
.logo i{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--em);color:#fff;font-style:normal;font-size:13px}
.search{position:relative;flex:1 1 220px;max-width:420px}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;background:var(--soft);font-size:16px}
.sres{position:absolute;left:0;right:0;top:44px;background:var(--bg);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px #0002;max-height:60vh;overflow:auto}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button:focus{background:var(--soft)}
.quick{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.store{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px}
.store b{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.store.on b{background:var(--em)}.store.local b{background:var(--warn)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:0 max(3vw,14px);scrollbar-width:thin}
nav.tabs a{flex:none;padding:9px 12px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a.on{color:var(--ink);border-color:var(--em)}
nav.tabs a .ct{font-size:11px;background:var(--pink);color:var(--pink-ink);border-radius:9px;padding:1px 6px;margin-left:5px;font-weight:700}
/* buttons, fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--em);border-color:var(--em);color:var(--em-ink);font-weight:700}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--bad);border-color:currentColor}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--em);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea,.inp{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);color:var(--ink);font-size:16px;width:100%}
label.f textarea{height:auto;min-height:80px;padding:8px 10px}
label.chk{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;min-height:40px;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--em)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.span2{grid-column:1/-1}
/* layout */
main{padding:22px max(3vw,14px) 60px;max-width:1320px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:6px 0 0;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:500;min-height:34px}
.fchip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;background:var(--bg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.sec{margin-top:26px}.sec>h2{margin-bottom:10px}
/* status pills */
.st{flex:none;display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:12px;white-space:nowrap;border:1px solid transparent}
.st.wait{background:var(--soft);color:var(--muted);border-color:var(--line)}
.st.rel{background:var(--pink);color:var(--pink-ink)}
.st.plan{border-color:var(--ink);color:var(--ink)}
.st.load{background:var(--ink);color:var(--bg)}
.st.del{background:var(--em);color:#fff}
.st.inv{border-color:var(--em);color:var(--em-deep)}
.st.bad{background:var(--bad);color:#fff}
.st.warn{border-color:var(--warn);color:var(--warn)}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;background:var(--soft);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--soft)}
td.vin{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:13px;white-space:nowrap}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* home */
.cover{background:var(--em);color:#fff;border-radius:14px;padding:clamp(20px,3vw,34px);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:24px;align-items:end}
.cover h1{font-size:clamp(30px,4.4vw,48px)}
.cover p{margin:8px 0 0;opacity:.9}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:#ffffff1f;border-radius:10px;padding:12px 14px;text-align:left;border:0;color:#fff;cursor:pointer}
.kpi:hover{background:#ffffff33}
.kpi b{display:block;font-size:clamp(26px,3vw,36px);line-height:1.05;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;opacity:.92}
.kpi.pk{background:var(--pink);color:var(--pink-ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tile{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--bg)}
.tile:hover{border-color:var(--em)}
.tile svg{flex:none;width:34px;height:34px;color:var(--em-deep)}
.tile b{display:block;font-size:16px}.tile span{font-size:13px;color:var(--muted)}
.alerts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.alerts li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;background:var(--soft);flex-wrap:wrap}
.alerts li.bad{background:var(--pink);color:var(--pink-ink)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px}
/* trip */
.tripgrid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.posmap{display:grid;gap:6px}
.posrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 10px repeat(3,minmax(0,1fr));gap:6px}
.pos{border:1.5px solid var(--line);border-radius:7px;padding:6px 7px;min-height:58px;font-size:12px;background:var(--soft)}
.pos.full{background:var(--bg);border-color:var(--ink)}
.pos b{font-size:11px;color:var(--muted);display:block}
.pos .m{font-weight:700;display:block;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.pos.none{visibility:hidden}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.vbig{font-size:20px;font-weight:800}
.vbig.ok{color:var(--em-deep)}.vbig.warn{color:var(--warn)}.vbig.bad{color:var(--bad)}
.stop{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.stop>header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--soft);flex-wrap:wrap}
.stop>header .n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.carline{display:flex;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.carline .grow{flex:1 1 200px}
.tag{font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
/* planner */
.plannerbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:10px;background:var(--pink);color:var(--pink-ink);margin-bottom:10px}
.plannerbar.free{background:var(--soft);color:var(--ink)}
iframe.planner{width:100%;height:calc(100vh - 210px);min-height:640px;border:1px solid var(--line);border-radius:10px;background:#fff}
/* handover */
.hcar{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.hcar.done{border-color:var(--em)}
.hgrid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.carsvg{width:100%;max-width:240px;height:auto;touch-action:manipulation}
.carsvg .z{fill:var(--soft);stroke:var(--muted);stroke-width:1.2;cursor:pointer}
.carsvg .z:hover{fill:var(--pink)}
.carsvg .z.hit{fill:var(--bad);opacity:.75}
.carsvg .z.old{fill:var(--warn);opacity:.55}
.carsvg text{font-size:9px;fill:var(--muted);pointer-events:none}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.thumbs figure{margin:0;position:relative}
.thumbs img{width:76px;height:58px;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.thumbs button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-size:12px;line-height:1}
.dmg{list-style:none;padding:0;margin:6px 0;display:grid;gap:4px}
.dmg li{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}
.dmg li.new{color:var(--bad);font-weight:700}
.sig{width:100%;max-width:520px;height:170px;border:1.5px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;display:block}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
/* modal */
.modal{position:fixed;inset:0;z-index:50;background:#0008;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.dlg{background:var(--bg);color:var(--ink);border-radius:14px;width:min(760px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:20px;box-shadow:0 20px 60px #0006}
.dlg>header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.dlg>footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.dlg>footer .left{margin-right:auto}
.x{border:0;background:none;font-size:24px;cursor:pointer;width:40px;height:40px;color:var(--ink)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:60;font-weight:500;max-width:90vw}
.toast[hidden]{display:none}
.note{padding:10px 12px;border-radius:8px;background:var(--soft);font-size:14px;margin:8px 0}
.note.pk{background:var(--pink);color:var(--pink-ink)}
/* eCMR sheet */
.cmr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;font-size:13px}
.cmr>div{border:0.5px solid var(--line);padding:8px 10px;min-height:56px}
.cmr>div.w{grid-column:1/-1}
.cmr i{display:block;font-style:normal;font-size:11px;color:var(--muted);font-weight:700}
.cmr img{max-height:60px;max-width:100%;background:#fff;border-radius:4px}
@media(max-width:860px){.cover,.two,.tripgrid,.hgrid{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.cmr{grid-template-columns:minmax(0,1fr)}.quick .btn span{display:none}main{padding-top:14px}.carsvg{max-width:170px;display:block;margin:0 auto}
  table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 10px;padding-inline-start:8.5em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:7.5em;margin-inline-start:-8em;white-space:normal;color:var(--muted);font-size:12px}.stack td:empty{display:none}.posrow{grid-template-columns:repeat(3,minmax(0,1fr)) 4px repeat(3,minmax(0,1fr));gap:4px}.pos{font-size:11px;padding:4px}}
@media(prefers-reduced-motion:no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<div class="top">
  <div class="bar1">
    <a class="logo" href="#home"><i>SB</i>SBMF <span style="font-weight:500">TMS</span></a>
    <div class="search">
      <input id="q" type="search" placeholder="Search VIN, order, trip, plate, customer…" autocomplete="off" aria-label="Search everything">
      <div class="sres" id="sres" hidden></div>
    </div>
    <div class="quick">
      <button class="btn pri" id="qOrder" title="New order">+ <span>Order</span></button>
      <button class="btn" id="qTrip" title="New trip">+ <span>Trip</span></button>
      <a class="btn" href="#handover" title="Start a handover">✓ <span>Handover</span></a>
      <span class="store" id="store"><b></b><span>Starting…</span></span>
    </div>
  </div>
  <nav class="tabs" id="tabs" aria-label="Modules"></nav>
</div>
<main id="main"></main>
<div class="modal" id="modal" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script src="cars-db.js"></script>
<script src="app.js"></script>
</body>
</html>
